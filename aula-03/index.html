<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 3 só de sacanagem</title>
  </head>

  <body>
    <h1>Aula 3</h1>

    <!-- Div = criar divisões na página -->
    <!-- atributo style = altera a visualização do elemento-->

    <div
      style="
        border: 5px solid black;
        width: 200px;
        height: 500px;
        background-color: lightblue;
      "
    >
      <p>Piplup</p>
    </div>

    <!-- div v2 -->

    <div
      style="
        border: 5px solid black;
        width: 400px;
        height: 500px;
        background-color: red;">
      <div
        style="
          border: 5px solid black;
          width: 200px;
          height: 250px;
          background-color: green;">
        alguma coisa
      </div>
      <div
        style="
          border: 5px solid black;
          width: 200px;
          height: 250px;
          background-color: yellow;">
        outra coisa
      </div>
    </div>




    
  </body>
</html>
