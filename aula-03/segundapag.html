<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>segundinha</title>
  </head>
  <body>
    <!-- Área do cabeçalho do site -->

    <header>
      <!-- Área da barra de navegação -->
      <nav>
        <!-- ul>li*3 -->
        <ul>
          <li>Home</li>
          <li>Contato</li>
          <li>Sobre</li>
        </ul>
      </nav>
    </header>

    <!-- Área do conteúdo principal do site -->
    <main>
      <!-- section = divide o site em seções idependentes -->
      <section>
        <!-- article= divide o site em artigos independentes, ou seja, cada artigo tem um assunto diferente. -->
        <article>
          <h2>Piplup</h2>
        </article>
        <article>
          <h2>Vaporeon</h2>
        </article>
        <article>
        <!-- Área que contém uma imagem e uma possível legenda descrevendo a imagem. -->
          <figure>
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_iGDSGLBtsun5bS0FsY9v893-I0NgEle57Q&s"
              alt="vaporeon"
              height="200px"
              width="200px"
            />
            <figcaption>Evoluções do Eevee (via Pedra d'Água) reconhecida por sua composição celular molecularmente similar à água, permitindo que se torne invisível ao nadar.</figcaption>
          </figure>
        </article>
      </section>

      <!-- area com informações segundárias como barra lateral, anúncios, etc. -->
      <aside>
        <h3>Barra Lateral cheio de pokemon</h3>
      </aside>
    </main>
    <!-- Área de rodapé do site -->

    <footer>
      <!-- ul>li*2 -->
      <ul>
        <li>Mapa do site</li>
        <li>Trabalhe conosco</li>
      </ul>
    </footer>
  </body>
</html>
