<!doctype html>
<html lang="pt-br">
   <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 02</title>
    <link rel="icon" href="https://toppng.com/uploads/preview/the-hollow-knight-emblem-11564231220x4twnowex1.png"/>
  

   </head>
   <body>

    <h1>tabelazinha</h1>

    <table border="5px">
        
        <!-- cabeçalho -->
        <thead>
            <tr>
                <th>nome</th>
                <th>item</th>
                <th>quantidade</th>
                <th>preço</th>
                
            </tr>
        </thead>
        
        <!-- corpo -->
        <tbody>
            <!-- crio uma linha -->
             <tr>
                <!-- crio uma coluna -->
                <td>Cajado</td>
                <td>Item mágico</td>
                <td>6</td>
                <td>R$270,00</td>
             </tr>

             <tr>
                <td>Espada</td>
                <td>Arma cortante</td>
                <td>12</td>
                <td>R$300,00</td>
             </tr>

             <tr>
                <td>Arco</td>
                <td>Arma de longo alcance</td>
                <td>8</td>
                <td>R$250,00</td>
             </tr>
             <tr>
               <td></td>
               <td></td>
               <td></td>
             </tr>
        </tbody>

        <!-- rodapé --> 
        <tfoot>
            <tr>
               <td colspan="4" align="center">Todos os direitos estão reservados ao desenvolvedor João Pedro &copy;2026</td>
            </tr>
        </tfoot>

    </table>

   </body>

</html>
