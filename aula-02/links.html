<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>

<body>
    <!-- a = links -->    
    <!-- href = para onde esse link deve ser redirecionado-->    
    <!-- target blank = abre o link em uma nova aba-->
     
    <!-- link para áreas externas-->

    <a href="https://www.youtube.com" target="_blank">
        YouTube
    </a>

    <!-- link para outros arquivos dentro do meu projeto-->
    <a href="./index.html"> Home </a>

    <hr>

    <!-- Img = Inserir uma imagem-->
    <!-- Width = Largura da imagem-->
    <!-- Height = Altura da imagem-->

    <h3>Hollow knight mt zika</h3>

    <img src="./images/hollow-knight.jpg" alt="Hollow knight mt zika" 
    width="250px">

    <h3>Hollow Knight mais zika ainda</h3>

    <img src="https://images.squarespace-cdn.com/content/v1/606d159a953867291018f801/6cf9fc95-a97a-42dd-840b-e4a48e26637b/HK_header.jpg" alt="Outro Hollow knight mt zika" 
    width="250px">

    <!-- Imagem, que também é link-->

    <a href="https://lista.mercadolivre.com.br/jogo-hollow-knight-xbox">
        <img src="https://cdng.europosters.eu/pod_public/1300/240925.jpg" alt="imagem para levar ao site do jogo" width="250px"
        height="142px">

    </a>


</body>

</html>
